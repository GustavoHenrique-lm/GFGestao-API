
name: CI - GF Gestões

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-api:
    name: Compilar API .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore GFGestao.API.csproj

      - name: Compilar API
        run: dotnet build GFGestao.API.csproj --configuration Release --no-restore

      - name: Executar testes da API
        run: dotnet test GFGestao.Tests/GFGestao.Tests.csproj --configuration Release

  build-frontend:
    name: Validar frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gfgestao.frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gfgestao.frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código (ESLint)
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  publish-artifacts:
    name: Publicar artefatos
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar API
        run: dotnet publish GFGestao.API.csproj --configuration Release --output ./artifacts/api

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gfgestao.frontend/package-lock.json

      - name: Compilar frontend
        working-directory: gfgestao.frontend
        run: |
          npm ci
          npm run build

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: gfgestao-${{ github.sha }}
          path: |
            artifacts/api/
            gfgestao.frontend/dist/